<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicios de JavaScript</title>
    <link rel="stylesheet" href="styles.css"> 
    <script defer src="script.js"></script> 
</head>
<body>
    <h1>Ejercicios de JavaScript</h1>

    <!-- Ejercicio 1 -->
    <h2>Contador de Caracteres</h2>
    <textarea id="commentBox" maxlength="200" placeholder="Escribe tu comentario..."></textarea>
    <p id="charCount">Caracteres restantes: 200</p>

    <!-- Ejercicio 2 -->
    <h2>Galería Interactiva</h2>

    

    <!-- Vista previa más grande -->

    <div id="previewContainer">
        <img id="previewImage" src="" alt="Vista previa">
        <p id="imageDescription"></p>
    </div>

    <div id="gallery">
        <img class="thumbnail" src="https://http2.mlstatic.com/D_Q_NP_844084-MLU73698617801_122023-O.webp" 
             alt="Proyecto 1" data-description="Descripción del Proyecto 1">
        <img class="thumbnail" src="https://ettos.co/cdn/shop/products/Base-Liquida-Resist-Petalo-Vogue-MAQUILLAJE-Ettos_co-Tienda-de-Belleza.webp?v=1734040223" 
             alt="Proyecto 2" data-description="Descripción del Proyecto 2">
        <img class="thumbnail" src="https://http2.mlstatic.com/D_NQ_NP_783041-MLU74223622010_022024-O.webp" 
             alt="Proyecto 3" data-description="Descripción del Proyecto 3">
        <img class="thumbnail" src="https://http2.mlstatic.com/D_NQ_NP_875323-MLU76217580501_052024-O.webp" 
             alt="Proyecto 4" data-description="Descripción del Proyecto 4">
        <img class="thumbnail" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT4tsFstAS9ftCOysEXn97KrDj9DOcnC7cHJg9FtWF2bVDTGOhmF9QarHwCCBxOTwH_wrU&usqp=CAU" 
             alt="Proyecto 5" data-description="Descripción del Proyecto 5">
        <img class="thumbnail" src="https://creafa.com.co/cdn/shop/files/BASEVOGUE.jpg?v=1737570866" 
             alt="Proyecto 6" data-description="Descripción del Proyecto 6">
    </div>
    
    <p id="imageDescription"></p>

    <!-- Ejercicio 3 -->
    <h2>Lista de Tareas</h2>
    <input type="text" id="taskInput" placeholder="Añadir una tarea...">
    <button id="addTask">Agregar</button>
    <ul id="taskList"></ul>
</body>
</html>
